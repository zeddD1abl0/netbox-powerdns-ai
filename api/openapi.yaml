# nbpdns's API (ADR-0012, ADR-0033): the source of truth for the API.
# `make generate` generates the server's code and the embedded copy of this
# file from it, and the reference page docs/reference/api.md. Every change
# must stay backward compatible: there's no version in the paths.
openapi: 3.1.0
info:
  title: nbpdns API
  version: 1.1.0
  description: >-
    The API of nbpdns, which compares the DNS data in NetBox's DNS plugin
    with what each PowerDNS server group's primary serves. It serves the
    service's status, each server group's drift, its zones and their
    changes, and each zone's DNS records as NetBox defines them. Everything
    is last-known state, as of the last successful read of each side. It
    changes nothing, and it receives NetBox's webhooks, which refresh the
    zones they name. Apart from those, which NetBox signs, the API has no
    authentication until M10, so serve it only on a trusted network.
  contact:
    name: nbpdns
    url: https://github.com/zeddD1abl0/netbox-powerdns-ai
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-api-id: f4c4a283-c96e-410e-a606-bdda49d9af95
  x-audience: company-internal
servers:
  - url: /api
    description: The API, at the service's address, `server.listen`.
# No authentication until M10 (ADR-0033): an empty requirement says so.
security:
  - {}
tags:
  - name: service
    description: The nbpdns service itself.
  - name: server-groups
    description: >-
      PowerDNS server groups: each is a primary, the servers that follow it,
      and the NetBox views whose zones they serve. A group's name is its
      stable ID.
  - name: netbox
    description: Events from NetBox, which make nbpdns refresh what changed.
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get the service's status
      description: >-
        Returns the service's build, uptime, readiness and liveness, the
        refresh schedule and how the last refresh went, NetBox's state, and
        where spans are exported. Each server group's state is a resource
        of its own, under `/server-groups`.
      tags: [service]
      parameters:
        - $ref: "#/components/parameters/FlowID"
      responses:
        "200":
          description: The service's status.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                version: v0.2.0
                revision: ec048d836f57f7ee1102e27b7baa38d8a17469bc
                started: "2026-10-08T01:00:00Z"
                uptime_seconds: 754.2
                ready: true
                live: true
                schedule:
                  interval_seconds: 300
                  timeout_seconds: 600
                  last_refresh:
                    started: "2026-10-08T01:10:00Z"
                    finished: "2026-10-08T01:10:02Z"
                    duration_seconds: 2.1
                    outcome: complete
                    error: null
                  last_complete_refresh: "2026-10-08T01:10:02Z"
                  next_refresh: "2026-10-08T01:15:00Z"
                  refreshes:
                    complete: 3
                    incomplete: 0
                    failed: 0
                netbox:
                  url: https://netbox.example.com/
                  up: true
                  error: null
                tracing:
                  exported: false
                  endpoint: null
                  protocol: null
                webhooks:
                  enabled: true
                  delay_seconds: 3
                  last_event:
                    received: "2026-10-08T01:11:58.2Z"
                    event: updated
                    object_type: netbox_dns.record
                    request:
                      id: 3bd63b08-a526-45f3-a819-aa7c507dd31f
                      user: admin
                  pending:
                    events: 0
                    zones: []
                    full: false
                    due: null
                  last_refresh:
                    started: "2026-10-08T01:12:01.2Z"
                    finished: "2026-10-08T01:12:01.6Z"
                    zones: [_default_/example.com.]
                    full: false
                    reason: null
                    outcome: complete
                    error: null
                    events: 3
                    requests:
                      - id: 3bd63b08-a526-45f3-a819-aa7c507dd31f
                        user: admin
        default:
          $ref: "#/components/responses/Problem"
  /server-groups:
    get:
      operationId: listServerGroups
      summary: List the server groups
      description: >-
        Returns a page of the server groups, in the configuration's order,
        each with its last-known state.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of server groups.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerGroupPage"
              example:
                self: https://nbpdns.example.com/api/server-groups?limit=1
                next: https://nbpdns.example.com/api/server-groups?cursor=eyJhIjoic2l0ZS1hIn0&limit=1
                items:
                  - name: site-a
                    primary_url: https://pdns-a.example.com:8443
                    views: [_default_, internal]
                    drift_policy: report
                    status: ok
                    error: null
                    last_success: "2026-10-08T01:10:02Z"
                    counts:
                      in_sync: 980
                      drift: 15
                      missing: 5
                      inactive_in_netbox: 0
                      ignored: 1
                      unmanaged: 2
                    problem_count: 0
                    warning_count: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Problem"
  /server-groups/{group}:
    get:
      operationId: getServerGroup
      summary: Get a server group
      description: Returns one server group, with its last-known state.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: The server group.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerGroup"
              example:
                name: site-a
                primary_url: https://pdns-a.example.com:8443
                views: [_default_, internal]
                drift_policy: report
                status: ok
                error: null
                last_success: "2026-10-08T01:10:02Z"
                counts:
                  in_sync: 980
                  drift: 15
                  missing: 5
                  inactive_in_netbox: 0
                  ignored: 1
                  unmanaged: 2
                problem_count: 0
                warning_count: 0
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /server-groups/{group}/zones:
    get:
      operationId: listZones
      summary: List a server group's zones
      description: >-
        Returns a page of the zones of a server group, as of its last
        successful read, in canonical name order: the zones NetBox assigns
        to it, and, with the state `unmanaged`, the zones on its primary
        that NetBox doesn't. A group never read has none, and `as_of` is
        null.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Group"
        - name: state
          in: query
          description: >-
            Only the zones in these states, such as `drift,missing`. The
            drifted states are `drift`, `missing` and `inactive_in_netbox`.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ZoneState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the group's zones.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZonePage"
              example:
                self: https://nbpdns.example.com/api/server-groups/site-a/zones?state=drift
                next: null
                as_of: "2026-10-08T01:10:02Z"
                items:
                  - zone: example.com.
                    view: _default_
                    policy: report
                    state: drift
                    netbox_serial: 2026100801
                    powerdns_serial: 2026100701
                    change_count: 2
                    rrset_count: 42
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /server-groups/{group}/zones/{zone}:
    get:
      operationId: getZone
      summary: Get a zone of a server group
      description: Returns one zone of a server group, as of the group's last successful read.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Group"
        - $ref: "#/components/parameters/ZoneName"
      responses:
        "200":
          description: The zone.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetail"
              example:
                zone: example.com.
                view: _default_
                policy: report
                state: drift
                netbox_serial: 2026100801
                powerdns_serial: 2026100701
                change_count: 2
                rrset_count: 42
                as_of: "2026-10-08T01:10:02Z"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /server-groups/{group}/zones/{zone}/changes:
    get:
      operationId: listZoneChanges
      summary: List a zone's changes
      description: >-
        Returns a page of the RRsets of a zone that differ between NetBox
        and the group's primary, as of the group's last successful read, in
        canonical order: by owner name, then the SOA, then NS, then the
        other types. A zone in sync has none.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Group"
        - $ref: "#/components/parameters/ZoneName"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the zone's changes.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
              example:
                self: https://nbpdns.example.com/api/server-groups/site-a/zones/example.com./changes
                next: null
                as_of: "2026-10-08T01:10:02Z"
                items:
                  - name: www.example.com.
                    type: A
                    kind: changed
                    netbox:
                      ttl: 300
                      values: [192.0.2.10]
                    powerdns:
                      ttl: 300
                      values: [192.0.2.99]
                  - name: old.example.com.
                    type: CNAME
                    kind: extra
                    netbox: null
                    powerdns:
                      ttl: 3600
                      values: [www.example.com.]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /server-groups/{group}/zones/{zone}/rrsets:
    get:
      operationId: listZoneRRsets
      summary: List a zone's RRsets, as NetBox defines them
      description: >-
        Returns a page of a zone's RRsets as NetBox defines them, in
        nbpdns's normalized form, as of NetBox's last successful read: what
        nbpdns compares with the group's primary, so what a client can
        publish elsewhere. Only active records are listed. The zone is the
        one in the group's NetBox views, the first by view name if several
        views have it. RRsets come in canonical order: by owner name, then
        the SOA, then NS, then the other types.
      tags: [server-groups]
      parameters:
        - $ref: "#/components/parameters/FlowID"
        - $ref: "#/components/parameters/Group"
        - $ref: "#/components/parameters/ZoneName"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of the zone's RRsets.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RRsetPage"
              example:
                self: https://nbpdns.example.com/api/server-groups/site-a/zones/example.com./rrsets
                next: null
                as_of: "2026-10-08T01:10:00Z"
                items:
                  - name: example.com.
                    type: SOA
                    ttl: 3600
                    records:
                      - value: ns1.example.com. hostmaster.example.com. 2026100801 10800 3600 604800 3600
                        managed: true
                  - name: www.example.com.
                    type: A
                    ttl: 300
                    records:
                      - value: 192.0.2.10
                        managed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
  /netbox-events:
    post:
      operationId: receiveNetBoxEvent
      summary: Receive a NetBox webhook
      description: >-
        Receives an event from a NetBox event rule's webhook, signed with
        `netbox.webhook_secret`, and queues a refresh of the zones it names,
        which runs once no event has come for `drift.webhook_delay`. A
        record's event names its zone, and a zone's event the zone, and its
        old name if it was renamed. An event for a view that a server group
        serves, by its name or its old one, a zone moved to another view, a
        record moved to another zone, and more than 100 zones at once each
        make a full refresh instead. Events for other object types, and for
        zones and views that no server group serves, are accepted and
        ignored. The endpoint is off until `netbox.webhook_secret` is
        set.
      tags: [netbox]
      security:
        - netboxSignature: []
      parameters:
        - $ref: "#/components/parameters/FlowID"
      requestBody:
        required: true
        description: It's the event, as NetBox's webhook sends it without a body template.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetBoxEvent"
            example:
              event: updated
              timestamp: "2026-10-08T07:14:37.453389+00:00"
              object_type: netbox_dns.record
              request:
                id: 3bd63b08-a526-45f3-a819-aa7c507dd31f
                path: /api/plugins/netbox-dns/records/102788/
                method: PATCH
                user: admin
              data:
                id: 102788
                name: www
                type: A
                value: 192.0.2.11
                zone:
                  id: 1106
                  name: example.com
                  view:
                    id: 1
                    name: _default_
              snapshots:
                prechange:
                  name: www
                  type: A
                  value: 192.0.2.10
                  zone: 1106
                postchange:
                  name: www
                  type: A
                  value: 192.0.2.11
                  zone: 1106
      responses:
        "202":
          description: >-
            The event is accepted. The refresh it asks for runs later, if it
            asks for one.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
        "400":
          $ref: "#/components/responses/InvalidEvent"
        "401":
          $ref: "#/components/responses/BadSignature"
        "404":
          $ref: "#/components/responses/WebhooksOff"
        "413":
          $ref: "#/components/responses/EventTooLarge"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    FlowID:
      name: X-Flow-ID
      in: header
      description: >-
        The request's flow ID, to follow it through the logs. A request
        without a valid one is given one. Either way, the response returns
        it, and it's the request's `request_id` in nbpdns's logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:+/=-]+$"
    Limit:
      name: limit
      in: query
      description: The most items the page may have.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      description: >-
        Where the page starts: a previous page's `next` link carries it.
        It's opaque, and only good with the same filters as the page that
        gave it.
      schema:
        type: string
        maxLength: 1024
    Group:
      name: group
      in: path
      required: true
      description: The server group's name.
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ZoneName:
      name: zone
      in: path
      required: true
      description: >-
        The zone's name, with or without its final dot, such as
        `example.com`. Internationalized names are given in their ASCII
        form, such as `xn--bcher-kva.example`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    FlowID:
      description: The request's flow ID, as sent, or as nbpdns made it.
      schema:
        type: string
  securitySchemes:
    netboxSignature:
      type: apiKey
      in: header
      name: X-Hook-Signature
      description: >-
        It's the hex HMAC-SHA512 of the request's body, keyed by
        `netbox.webhook_secret`, as a NetBox webhook sends it when its
        secret is set.
  responses:
    BadRequest:
      description: A parameter is invalid, such as a limit out of range, or a cursor that this API didn't give.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The limit must be from 1 to 1000.
            instance: /api/server-groups
    NotFound:
      description: No such resource.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No server group is named site-z.
            instance: /api/server-groups/site-z
    InvalidEvent:
      description: The body isn't an event that NetBox sends, such as JSON without an `object_type`.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "The body isn't an event that NetBox sends: a netbox_dns.record event's data has no zone with a name and a view."
            instance: /api/netbox-events
    BadSignature:
      description: >-
        The request's `X-Hook-Signature` is missing, or isn't the body's,
        keyed by `netbox.webhook_secret`. Nothing in the body is read.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
        WWW-Authenticate:
          description: The scheme to authenticate with, which names the signature's header.
          schema:
            type: string
            examples: [X-Hook-Signature]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: >-
              The request's X-Hook-Signature isn't the body's: set the
              webhook's secret in NetBox to netbox.webhook_secret.
            instance: /api/netbox-events
    WebhooksOff:
      description: Webhooks are off, because `netbox.webhook_secret` isn't set.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Webhooks are off. Set netbox.webhook_secret, and give NetBox's webhook the same secret, to turn them on.
            instance: /api/netbox-events
    EventTooLarge:
      description: The body is over 1 MiB, which no event that nbpdns reads needs.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Request Entity Too Large
            status: 413
            detail: The body is over 1 MiB.
            instance: /api/netbox-events
    Problem:
      description: Any other error.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: null
            instance: /api/status
  schemas:
    Problem:
      type: object
      description: An error, as RFC 9457 describes it.
      required: [type, title, status, detail, instance]
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          detail: No server group is named site-z.
          instance: /api/server-groups/site-z
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            The kind of problem. `about:blank` means the status code says it
            all.
          examples: [about:blank]
        title:
          type: string
          description: A short summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The response's HTTP status code.
          examples: [404]
        detail:
          type: [string, "null"]
          description: What went wrong with this request, or null.
          examples: [No server group is named site-z.]
        instance:
          type: [string, "null"]
          format: uri-reference
          description: The path of the request that had the problem, or null.
          examples: [/api/server-groups/site-z]
    Status:
      type: object
      description: The nbpdns service's state.
      required: [version, revision, started, uptime_seconds, ready, live, schedule, netbox, tracing, webhooks]
      properties:
        version:
          type: string
          description: The build's version.
          examples: [v0.2.0]
        revision:
          type: string
          description: The build's Git commit.
          examples: [ec048d836f57f7ee1102e27b7baa38d8a17469bc]
        started:
          type: string
          format: date-time
          description: When the service started.
          examples: ["2026-10-08T01:00:00Z"]
        uptime_seconds:
          type: number
          format: double
          minimum: 0
          description: The time since the service started.
          examples: [754.2]
        ready:
          type: boolean
          description: >-
            Whether the first refresh has finished, whatever its outcome, as
            `/readyz` reports.
          examples: [true]
        live:
          type: boolean
          description: >-
            Whether a refresh has started within `drift.interval` +
            `drift.timeout` + 1 minute, as `/livez` reports.
          examples: [true]
        schedule:
          $ref: "#/components/schemas/Schedule"
        netbox:
          $ref: "#/components/schemas/NetBoxState"
        tracing:
          $ref: "#/components/schemas/Tracing"
        webhooks:
          $ref: "#/components/schemas/Webhooks"
    Schedule:
      type: object
      description: The refreshes' schedule, and how they went.
      required: [interval_seconds, timeout_seconds, last_refresh, last_complete_refresh, next_refresh, refreshes]
      properties:
        interval_seconds:
          type: number
          format: double
          minimum: 0
          description: The time from the start of one refresh to the start of the next, `drift.interval`.
          examples: [300]
        timeout_seconds:
          type: number
          format: double
          minimum: 0
          description: How long a refresh may take, `drift.timeout`.
          examples: [600]
        last_refresh:
          description: The last refresh that finished, or null before the first.
          oneOf:
            - $ref: "#/components/schemas/Refresh"
            - type: "null"
        last_complete_refresh:
          type: [string, "null"]
          format: date-time
          description: When the last complete refresh finished, or null.
          examples: ["2026-10-08T01:10:02Z"]
        next_refresh:
          type: [string, "null"]
          format: date-time
          description: When the next refresh starts, or null while one runs.
          examples: ["2026-10-08T01:15:00Z"]
        refreshes:
          $ref: "#/components/schemas/RefreshCounts"
    Refresh:
      type: object
      description: A refresh that finished.
      required: [started, finished, duration_seconds, outcome, error]
      properties:
        started:
          type: string
          format: date-time
          description: When the refresh started.
          examples: ["2026-10-08T01:10:00Z"]
        finished:
          type: string
          format: date-time
          description: When the refresh finished.
          examples: ["2026-10-08T01:10:02Z"]
        duration_seconds:
          type: number
          format: double
          minimum: 0
          description: How long the refresh took.
          examples: [2.1]
        outcome:
          type: string
          enum: [complete, incomplete, failed]
          description: >-
            `complete` if NetBox and every group's primary were read,
            `incomplete` if a primary couldn't be, and `failed` if NetBox
            couldn't be, or the refresh ran out of time.
          examples: [complete]
        error:
          type: [string, "null"]
          description: >-
            Why a failed refresh failed: NetBox's error, or the timeout's.
            Null otherwise. A group's error is with the group.
          examples: [null]
    RefreshCounts:
      type: object
      description: The refreshes that finished since the service started, by outcome.
      required: [complete, incomplete, failed]
      properties:
        complete:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that read NetBox and every group's primary.
          examples: [3]
        incomplete:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that couldn't read a group's primary.
          examples: [0]
        failed:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that couldn't read NetBox, or ran out of time.
          examples: [0]
    NetBoxState:
      type: object
      description: NetBox's state, as of the last refresh.
      required: [url, up, error]
      properties:
        url:
          type: string
          format: uri
          description: NetBox's URL, `netbox.url`.
          examples: [https://netbox.example.com/]
        up:
          type: [boolean, "null"]
          description: Whether the last refresh could read NetBox, or null before the first.
          examples: [true]
        error:
          type: [string, "null"]
          description: Why NetBox couldn't be read, or null.
          examples: [null]
    Tracing:
      type: object
      description: Where the service's spans are exported.
      required: [exported, endpoint, protocol]
      properties:
        exported:
          type: boolean
          description: Whether spans are exported, which they are when `otlp.endpoint` is set.
          examples: [true]
        endpoint:
          type: [string, "null"]
          description: The OTLP collector's endpoint, `otlp.endpoint`, or null.
          examples: [https://otel.example.com:4318]
        protocol:
          description: The OTLP protocol, `otlp.protocol`, or null.
          oneOf:
            - $ref: "#/components/schemas/OTLPProtocol"
            - type: "null"
    Webhooks:
      type: object
      description: The state of NetBox's webhooks, which refresh the zones they name.
      required: [enabled, delay_seconds, last_event, pending, last_refresh]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether `netbox.webhook_secret` is set, so that
            `/api/netbox-events` takes NetBox's webhooks.
          examples: [true]
        delay_seconds:
          type: number
          format: double
          minimum: 0
          description: >-
            How long the zones that webhooks name wait for the webhooks to
            stop coming, `drift.webhook_delay`.
          examples: [3]
        last_event:
          description: The last event that a signed webhook brought, or null before the first.
          oneOf:
            - $ref: "#/components/schemas/WebhookEvent"
            - type: "null"
        pending:
          $ref: "#/components/schemas/PendingRefresh"
        last_refresh:
          description: >-
            The last refresh that webhooks asked for, or that covered the
            zones they named, or null.
          oneOf:
            - $ref: "#/components/schemas/WebhookRefresh"
            - type: "null"
    WebhookEvent:
      type: object
      description: An event that a NetBox webhook brought.
      required: [received, event, object_type, request]
      properties:
        received:
          type: string
          format: date-time
          description: When it came.
          examples: ["2026-10-08T01:11:58.2Z"]
        event:
          type: string
          description: What the event said happened to the object, `created`, `updated` or `deleted`.
          examples: [updated]
        object_type:
          type: string
          description: The object's type, such as `netbox_dns.record`.
          examples: [netbox_dns.record]
        request:
          $ref: "#/components/schemas/ChangeRequest"
    ChangeRequest:
      type: object
      description: The NetBox request that made a change.
      required: [id, user]
      properties:
        id:
          type: [string, "null"]
          description: NetBox's ID for the request, or null if no request made the change.
          examples: [3bd63b08-a526-45f3-a819-aa7c507dd31f]
        user:
          type: [string, "null"]
          description: The user who made the request, or null.
          examples: [admin]
    PendingRefresh:
      type: object
      description: What NetBox's webhooks queued, waiting for its refresh.
      required: [events, zones, full, due]
      properties:
        events:
          type: integer
          format: int64
          minimum: 0
          description: The webhooks whose refresh waits.
          examples: [2]
        zones:
          type: array
          items:
            type: string
          description: >-
            The zones that webhooks named, waiting, each as `view/name`. Once
            a full refresh waits, it covers them, and no more are added.
          examples: [[_default_/example.org.]]
        full:
          type: boolean
          description: >-
            Whether a full refresh waits: for a change to a view that a
            server group serves, a zone or a record that moved, or more than
            100 zones.
          examples: [false]
        due:
          type: [string, "null"]
          format: date-time
          description: >-
            When the refresh is due, unless the scheduled one comes first,
            or null if nothing waits.
          examples: ["2026-10-08T01:12:01.2Z"]
    WebhookRefresh:
      type: object
      description: A refresh that NetBox's webhooks asked for, or that covered the zones they named, which finished.
      required: [started, finished, zones, full, reason, outcome, error, events, requests]
      properties:
        started:
          type: string
          format: date-time
          description: When it started.
          examples: ["2026-10-08T01:12:01.2Z"]
        finished:
          type: string
          format: date-time
          description: When it finished.
          examples: ["2026-10-08T01:12:01.6Z"]
        zones:
          type: [array, "null"]
          items:
            type: string
          description: The zones it refreshed, each as `view/name`, or null for a full refresh.
          examples: [[_default_/example.com.]]
        full:
          type: boolean
          description: Whether it was a full refresh.
          examples: [false]
        reason:
          type: [string, "null"]
          description: Why it was a full refresh, such as `view internal was updated`, or null.
          examples: [null]
        outcome:
          type: string
          enum: [complete, incomplete, failed]
          description: >-
            `complete` if NetBox and every group it compared were read,
            `incomplete` if a group's primary couldn't be, and `failed` if
            NetBox couldn't be, or it ran out of time.
          examples: [complete]
        error:
          type: [string, "null"]
          description: Why it failed, or null.
          examples: [null]
        events:
          type: integer
          format: int64
          minimum: 0
          description: The webhooks it served.
          examples: [3]
        requests:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRequest"
          description: The NetBox requests whose changes it refreshed, up to 128.
          examples:
            - - id: 3bd63b08-a526-45f3-a819-aa7c507dd31f
                user: admin
    OTLPProtocol:
      type: string
      description: An OTLP protocol.
      enum: [http/protobuf, grpc]
      examples: [http/protobuf]
    DriftPolicy:
      type: string
      description: >-
        What nbpdns does about a zone's drift: `report` reports it, `enforce`
        reports it and, from M14, corrects it, and `ignore` doesn't compare
        the zone.
      enum: [enforce, report, ignore]
      examples: [report]
    ServerGroup:
      type: object
      description: >-
        A PowerDNS server group, with its last-known state. The counts are
        as of `last_success`.
      required: [name, primary_url, views, drift_policy, status, error, last_success, counts, problem_count, warning_count]
      properties:
        name:
          type: string
          description: The group's name, its stable ID.
          examples: [site-a]
        primary_url:
          type: string
          format: uri
          description: The URL of the group's primary's PowerDNS API.
          examples: [https://pdns-a.example.com:8443]
        views:
          type: array
          items:
            type: string
          description: The NetBox views whose zones the group serves.
          examples: [[_default_, internal]]
        drift_policy:
          $ref: "#/components/schemas/DriftPolicy"
        status:
          type: string
          enum: [ok, failed, unknown]
          description: >-
            `ok` if the last refresh that tried the group's primary read
            it, `failed` if it couldn't, and `unknown` before any did.
          examples: [ok]
        error:
          type: [string, "null"]
          description: Why the primary couldn't be read, or null.
          examples: [null]
        last_success:
          type: [string, "null"]
          format: date-time
          description: >-
            When the group was last read and compared in full, or null if it
            never was. Zones that NetBox's webhooks named may have been
            compared since.
          examples: ["2026-10-08T01:10:02Z"]
        counts:
          description: >-
            The group's zones by state, as of `last_success`, and of the zone
            refreshes since, or null if it was never read.
          examples:
            - {in_sync: 980, drift: 15, missing: 5, inactive_in_netbox: 0, ignored: 1, unmanaged: 2}
          oneOf:
            - $ref: "#/components/schemas/ZoneCounts"
            - type: "null"
        problem_count:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            How many problems normalization worked around in either side's
            data, as of `last_success`, or null. `nbpdns drift` lists them.
          examples: [0]
        warning_count:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            How many problems with the configuration or NetBox's data the
            comparison worked around, as of `last_success`, or null.
            `nbpdns drift` lists them.
          examples: [0]
    ZoneCounts:
      type: object
      description: A server group's zones, by state.
      required: [in_sync, drift, missing, inactive_in_netbox, ignored, unmanaged]
      properties:
        in_sync:
          type: integer
          format: int64
          minimum: 0
          description: Zones that the primary serves as NetBox says.
          examples: [980]
        drift:
          type: integer
          format: int64
          minimum: 0
          description: Zones whose RRsets differ.
          examples: [15]
        missing:
          type: integer
          format: int64
          minimum: 0
          description: Active NetBox zones that the primary doesn't serve.
          examples: [5]
        inactive_in_netbox:
          type: integer
          format: int64
          minimum: 0
          description: NetBox zones that aren't active, which the primary still serves.
          examples: [0]
        ignored:
          type: integer
          format: int64
          minimum: 0
          description: Zones whose drift policy is `ignore`, which aren't compared.
          examples: [1]
        unmanaged:
          type: integer
          format: int64
          minimum: 0
          description: Zones on the primary that NetBox doesn't assign to the group. They aren't drift.
          examples: [2]
    PageLinks:
      type: object
      description: The links of a page of a list (Zalando [248]).
      required: [self, next]
      properties:
        self:
          type: string
          format: uri
          description: This page's absolute URL.
          examples: ["https://nbpdns.example.com/api/server-groups?limit=2"]
        next:
          type: [string, "null"]
          format: uri
          description: The next page's absolute URL, or null on the last page.
          examples: ["https://nbpdns.example.com/api/server-groups?cursor=eyJhIjoic2l0ZS1iIn0&limit=2"]
    ServerGroupPage:
      description: One page of the server groups, with its links.
      allOf:
        - $ref: "#/components/schemas/PageLinks"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServerGroup"
              description: The page's server groups.
              examples:
                - - name: site-a
                    primary_url: https://pdns-a.example.com:8443
                    views: [_default_]
                    drift_policy: report
                    status: unknown
                    error: null
                    last_success: null
                    counts: null
                    problem_count: null
                    warning_count: null
    ZoneState:
      type: string
      description: >-
        A zone's state: `in_sync` if the primary serves it as NetBox says,
        `drift` if its RRsets differ, `missing` if the primary doesn't serve
        an active NetBox zone, `inactive_in_netbox` if the primary serves a
        zone that isn't active in NetBox, `ignored` if its drift policy is
        `ignore`, and `unmanaged` if the primary serves a zone that NetBox
        doesn't assign to the group.
      enum: [in_sync, drift, missing, inactive_in_netbox, ignored, unmanaged]
      examples: [drift]
    Zone:
      type: object
      description: A zone of a server group, as of the group's last successful read.
      required: [zone, view, policy, state, netbox_serial, powerdns_serial, change_count, rrset_count]
      properties:
        zone:
          type: string
          description: The zone's absolute name, with its final dot.
          examples: [example.com.]
        view:
          type: [string, "null"]
          description: The zone's NetBox view, or null for an unmanaged zone, which NetBox doesn't have.
          examples: [_default_]
        policy:
          description: The zone's drift policy, or null for an unmanaged zone.
          examples: [report]
          oneOf:
            - $ref: "#/components/schemas/DriftPolicy"
            - type: "null"
        state:
          $ref: "#/components/schemas/ZoneState"
        netbox_serial:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The zone's SOA serial in NetBox, or null. Serials aren't compared.
          examples: [2026100801]
        powerdns_serial:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The zone's SOA serial on the primary, or null if it doesn't serve the zone.
          examples: [2026100701]
        change_count:
          type: integer
          format: int64
          minimum: 0
          description: How many of the zone's RRsets differ, which `changes` lists.
          examples: [2]
        rrset_count:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            How many RRsets with active records NetBox defines for the zone,
            which `rrsets` lists, as of NetBox's last successful read, or
            null if NetBox has no active zone of that name in the group's
            views.
          examples: [42]
    ZoneDetail:
      description: A zone of a server group, and when the group was last read.
      allOf:
        - $ref: "#/components/schemas/Zone"
        - type: object
          required: [as_of]
          properties:
            as_of:
              type: string
              format: date-time
              description: >-
                Its group's `last_success`: when the group was last compared
                in full. A zone that NetBox's webhooks named may have been
                compared since.
              examples: ["2026-10-08T01:10:02Z"]
    ZonePage:
      description: One page of a server group's zones, with its links.
      allOf:
        - $ref: "#/components/schemas/PageLinks"
        - type: object
          required: [as_of, items]
          properties:
            as_of:
              type: [string, "null"]
              format: date-time
              description: >-
                What the zones are as of, the group's `last_success`, or null
                if the group was never read. Zones that NetBox's webhooks
                named may have been compared since.
              examples: ["2026-10-08T01:10:02Z"]
            items:
              type: array
              items:
                $ref: "#/components/schemas/Zone"
              description: The page's zones.
              examples:
                - - zone: example.com.
                    view: _default_
                    policy: report
                    state: in_sync
                    netbox_serial: 2026100801
                    powerdns_serial: 2026100801
                    change_count: 0
                    rrset_count: 42
    ChangeKind:
      type: string
      description: >-
        How an RRset differs: `missing` if NetBox has it and the primary
        doesn't serve it, `extra` if the primary serves it and NetBox
        doesn't have it, and `changed` if its values or TTL differ.
      enum: [missing, extra, changed]
      examples: [changed]
    Side:
      type: object
      description: An RRset as one side serves it.
      required: [ttl, values]
      properties:
        ttl:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The RRset's TTL, in seconds.
          examples: [300]
        values:
          type: array
          items:
            type: string
          description: The RRset's values, in normalized form, in sorted order.
          examples: [[192.0.2.10]]
    Change:
      type: object
      description: An RRset that differs between NetBox and the group's primary.
      required: [name, type, kind, netbox, powerdns]
      properties:
        name:
          type: string
          description: The RRset's absolute owner name.
          examples: [www.example.com.]
        type:
          type: string
          description: The RRset's type, such as `A`.
          examples: [A]
        kind:
          $ref: "#/components/schemas/ChangeKind"
        netbox:
          description: The RRset as NetBox has it, or null if NetBox doesn't.
          examples: [{ttl: 300, values: [192.0.2.10]}]
          oneOf:
            - $ref: "#/components/schemas/Side"
            - type: "null"
        powerdns:
          description: The RRset as the primary serves it, or null if it doesn't.
          examples: [{ttl: 300, values: [192.0.2.99]}]
          oneOf:
            - $ref: "#/components/schemas/Side"
            - type: "null"
    ChangePage:
      description: One page of a zone's changes, with its links.
      allOf:
        - $ref: "#/components/schemas/PageLinks"
        - type: object
          required: [as_of, items]
          properties:
            as_of:
              type: string
              format: date-time
              description: >-
                When the group was last compared in full. A zone that
                NetBox's webhooks named may have been compared since.
              examples: ["2026-10-08T01:10:02Z"]
            items:
              type: array
              items:
                $ref: "#/components/schemas/Change"
              description: The page's changes.
              examples:
                - - name: www.example.com.
                    type: A
                    kind: missing
                    netbox: {ttl: 300, values: [192.0.2.10]}
                    powerdns: null
    Record:
      type: object
      description: A record of an RRset.
      required: [value, managed]
      properties:
        value:
          type: string
          description: The record's data, normalized as nbpdns compares it.
          examples: [192.0.2.10]
        managed:
          type: boolean
          description: >-
            Whether NetBox's DNS plugin makes the record itself, such as the
            zone's SOA and NS records, rather than a user.
          examples: [false]
    RRset:
      type: object
      description: An RRset as NetBox defines it, with its active records.
      required: [name, type, ttl, records]
      properties:
        name:
          type: string
          description: The absolute owner name of the RRset's records.
          examples: [www.example.com.]
        type:
          type: string
          description: The type of the RRset's records, such as `A` or `MX`.
          examples: [A]
        ttl:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The RRset's one TTL, in seconds, which NetBox's records give it.
          examples: [300]
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Record"
          description: The RRset's active records, sorted by value.
          examples:
            - - value: 192.0.2.10
                managed: false
    RRsetPage:
      description: One page of a zone's RRsets, with its links.
      allOf:
        - $ref: "#/components/schemas/PageLinks"
        - type: object
          required: [as_of, items]
          properties:
            as_of:
              type: string
              format: date-time
              description: >-
                When NetBox was last read in full, which the RRsets are as
                of. A zone that NetBox's webhooks named may have been read
                since.
              examples: ["2026-10-08T01:10:00Z"]
            items:
              type: array
              items:
                $ref: "#/components/schemas/RRset"
              description: The page's RRsets.
              examples:
                - - name: www.example.com.
                    type: A
                    ttl: 300
                    records:
                      - value: 192.0.2.10
                        managed: false
    NetBoxEvent:
      type: object
      description: >-
        A NetBox webhook's event, as NetBox 4.7 sends it without a body
        template: what happened to an object, the object, and the request
        that made the change. nbpdns reads only the fields below, and
        ignores the rest.
      required: [event, object_type]
      # The server decodes it as internal/webhook's Event, which reads what
      # nbpdns needs from NetBox's own objects.
      x-go-type: webhook.Event
      x-go-type-import:
        path: github.com/zeddD1abl0/netbox-powerdns-ai/internal/webhook
      examples:
        - event: deleted
          object_type: netbox_dns.zone
          request:
            id: 23778ad9-07a9-40a0-b9f2-721252181a5e
            user: admin
          data:
            id: 1106
            name: example.com
            view:
              id: 1
              name: _default_
          snapshots:
            prechange:
              name: example.com
              view: 1
            postchange: null
      properties:
        event:
          type: string
          description: What happened to the object, such as `created`, `updated` or `deleted`.
          examples: [updated]
        timestamp:
          type: string
          format: date-time
          description: When it happened.
          examples: ["2026-10-08T07:14:37.453389+00:00"]
        object_type:
          type: string
          description: >-
            The object's type. nbpdns reads `netbox_dns.record`,
            `netbox_dns.zone` and `netbox_dns.view`, and ignores the others.
          examples: [netbox_dns.record]
        request:
          description: The NetBox request that made the change, or null if none did.
          oneOf:
            - $ref: "#/components/schemas/NetBoxRequest"
            - type: "null"
        data:
          type: object
          additionalProperties: true
          description: >-
            The object, as NetBox's API serializes it: after the change, or
            before it, for a deletion. A record's has its `zone`, with the
            zone's `id`, `name` and `view`, and a zone's has its `id`,
            `name` and `view`, each view with its `id` and `name`.
          examples:
            - id: 1106
              name: example.com
              view:
                id: 1
                name: _default_
        snapshots:
          description: The object's fields around the change, with related objects as their IDs.
          oneOf:
            - $ref: "#/components/schemas/NetBoxSnapshots"
            - type: "null"
    NetBoxRequest:
      type: object
      description: A NetBox request, as its webhooks describe it.
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
          description: NetBox's ID for the request, which every event it causes shares.
          examples: [23778ad9-07a9-40a0-b9f2-721252181a5e]
        user:
          type: string
          description: The name of the user who made the request.
          examples: [admin]
    NetBoxSnapshots:
      type: object
      description: An object's fields before and after a change.
      additionalProperties: true
      properties:
        prechange:
          type: [object, "null"]
          additionalProperties: true
          description: >-
            The fields before the change: null for a creation, and for some
            updates that the DNS plugin makes itself. A renamed zone's has
            its old `name`, and a moved zone's its old `view` ID, as a moved
            record's has its old `zone` ID.
          examples:
            - name: example.com
              view: 1
        postchange:
          type: [object, "null"]
          additionalProperties: true
          description: The fields after the change, or null for a deletion.
          examples: [null]
