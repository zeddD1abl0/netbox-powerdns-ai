# gitleaks configuration for `make secrets`: every default rule, plus one
# allowlist for the development lab's published admin token
# (deploy/dev/compose.yaml), which the docs quote in examples. Anything else
# that looks like a secret still fails the scan.
[extend]
useDefault = true

[[allowlists]]
description = "The development lab's published admin token"
regexes = ['''nbpdnsLabAdminTokenNotForProduction00000''']
