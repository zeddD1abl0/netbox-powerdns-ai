# CI for nbpdns on GitLab, in stages (ADR-0016). Every job only runs make
# targets (ADR-0014). `make project-lint` checks that together the jobs run
# exactly what `make ci` runs, in the Makefile's CI_IMAGE. To add a check, add
# a make target, add it to `ci`, and add a job here and in
# .github/workflows/ci.yml.

stages:
  - lint
  - test
  - build
  - security

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Every job: the official Go image (Debian, glibc: ADR-0015), pinned by digest.
# It ships Go 1.27.1, go.mod's toolchain, so no other Go is ever downloaded.
.go:
  image: golang:1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244
  variables:
    GOTOOLCHAIN: local

go-lint:
  extends: .go
  stage: lint
  script:
    - make vet lint

docs-lint:
  extends: .go
  stage: lint
  script:
    - make docs-lint

api-lint:
  extends: .go
  stage: lint
  script:
    - make api-lint

project-lint:
  extends: .go
  stage: lint
  script:
    - make project-lint

unit-test:
  extends: .go
  stage: test
  script:
    - make test

docs-site:
  extends: .go
  stage: build
  script:
    - make docs-links

vuln:
  extends: .go
  stage: security
  script:
    - make vuln

secrets:
  extends: .go
  stage: security
  variables:
    GIT_DEPTH: "0" # gitleaks scans the whole history
  script:
    - make secrets
