# CI for nbpdns on GitLab, in stages (ADR-0032). Every job only runs make
# targets (ADR-0022). `make project-lint` checks that together the jobs run
# exactly what `make ci` runs, in the Makefile's CI_IMAGE. To add a check, add
# a make target, add it to `ci`, and add a job here and in
# .github/workflows/ci.yml.

stages:
  - lint
  - test
  - build
  - security
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # A tag's pipeline runs every check, then, for a version tag, publishes.
    - if: $CI_COMMIT_TAG

# Every job: the official Go image (Debian, glibc: ADR-0031), pinned by digest.
# It ships Go 1.27.1, go.mod's toolchain, so no other Go is ever downloaded.
.go:
  image: golang:1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244
  variables:
    GOTOOLCHAIN: local

go-lint:
  extends: .go
  stage: lint
  script:
    - make vet lint generate-check

docs-lint:
  extends: .go
  stage: lint
  script:
    - make docs-lint

api-lint:
  extends: .go
  stage: lint
  script:
    - make api-lint

project-lint:
  extends: .go
  stage: lint
  script:
    - make project-lint

unit-test:
  extends: .go
  stage: test
  script:
    - make test

# The lab runs in a Docker-in-Docker service, which needs a privileged
# runner, like the self-hosted Kubernetes runners (Q-049). The lab is one
# NetBox and one PowerDNS server (ADR-0023, ADR-0026). The service's resident
# memory peaks at about 1.1 to 1.25 GiB, almost all of it NetBox applying its
# first-start migrations, and the job's at about 0.35 GiB; the service stores
# about 2.2 GB (ITEM-0028, ITEM-0037). It waits for unit-test, so the two
# never share the runner's memory: run together, the runner killed it
# (ITEM-0075).
integration-test:
  extends: .go
  stage: test
  needs: [unit-test]
  services:
    - name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - make test-integration

build:
  extends: .go
  stage: build
  script:
    - make build

# The release check builds the release as a snapshot, publishing nothing,
# and tests it (ADR-0030). Its image goes into a Docker-in-Docker service,
# without the lab, so it needs a fraction of the integration job's memory.
release-check:
  extends: .go
  stage: build
  services:
    - name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - make release-check

docs-site:
  extends: .go
  stage: build
  script:
    - make docs-links

vuln:
  extends: .go
  stage: security
  script:
    - make vuln

secrets:
  extends: .go
  stage: security
  variables:
    GIT_DEPTH: "0" # gitleaks scans the whole history
  script:
    - make secrets

# Publishing (ADR-0030), the one tag-only job that `make project-lint` allows
# (ADR-0032): for a version tag, after every other stage of the tag's
# pipeline has passed. GitLab's variables are mapped to the names that
# `make release` takes, so the Makefile names no forge. The job token pushes
# the image to the project's registry, and makes the release.
release:
  extends: .go
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    RELEASE_IMAGE: $CI_REGISTRY_IMAGE
    RELEASE_REGISTRY: $CI_REGISTRY
    RELEASE_REGISTRY_USER: $CI_REGISTRY_USER
    RELEASE_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GITLAB_API_URL: $CI_API_V4_URL
    GITLAB_URL: $CI_SERVER_URL
  script:
    - make release
