# CI for nbpdns on GitLab, in stages (ADR-0032). Every job only runs make
# targets (ADR-0022). `make project-lint` checks that together the jobs run
# exactly what `make ci` runs, in the Makefile's CI_IMAGE. To add a check, add
# a make target, add it to `ci`, and add a job here and in
# .github/workflows/ci.yml.

stages:
  - lint
  - test
  - build
  - security
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # A tag's pipeline runs every check, then, for a version tag, publishes.
    - if: $CI_COMMIT_TAG

# Every job: the official Go image (Debian, glibc: ADR-0031), pinned by digest.
# It ships Go 1.27.3, go.mod's toolchain, so no other Go is ever downloaded.
.go:
  image: golang:1.27.3@sha256:f20d83a83e18dbd2a4714b8ffd4b30b287b6243962dd75608e86abcc63ba4efc
  variables:
    GOTOOLCHAIN: local

# The jobs that need the most memory: compiling every package, with the race
# detector or for the linter, the lab, and the release's builds. They share
# one resource group, so only one of them runs at a time across all of the
# project's pipelines: a tag pushed on a merge commit starts a second
# pipeline beside main's, and the runner killed main's unit-test while both
# ran (ITEM-0100). Within a pipeline, they're in different stages anyway.
#
# Each also requests memory, so that Kubernetes places it only on a node
# that has it free, and kills other pods before it when a node runs short:
# the runner killed release-check twice on its smallest node (ITEM-0100).
# With a cold build cache on 16 CPUs, the job's processes peak together at
# 1.65 GiB for the integration tests' build, 1.62 GiB for the unit tests,
# 1.60 GiB for the linter, and 0.82 GiB for the release. The runner's nodes
# have 2 CPUs, so the jobs compile less at once there. The request takes
# effect only up to the runner's memory_request_overwrite_max_allowed.
.heavy:
  resource_group: runner-memory
  variables:
    KUBERNETES_MEMORY_REQUEST: 2Gi

go-lint:
  extends: [.go, .heavy]
  stage: lint
  script:
    - make vet lint generate-check tidy-check

docs-lint:
  extends: .go
  stage: lint
  script:
    - make docs-lint

api-lint:
  extends: .go
  stage: lint
  script:
    - make api-lint

project-lint:
  extends: .go
  stage: lint
  script:
    - make project-lint

unit-test:
  extends: [.go, .heavy]
  stage: test
  script:
    - make test

# The lab runs in a Docker-in-Docker service, which needs a privileged
# runner, like the self-hosted Kubernetes runners (Q-049). The lab is one
# NetBox and one PowerDNS server (ADR-0023, ADR-0026). The service's resident
# memory peaks at about 1.1 to 1.25 GiB, almost all of it NetBox applying its
# first-start migrations, and it stores about 2.2 GB (ITEM-0028, ITEM-0037).
# So the service requests 1.5 GiB, up to the runner's
# service_memory_request_overwrite_max_allowed, beside .heavy's 2 GiB for
# the job, whose build peaks at 1.65 GiB (ITEM-0100). It waits for
# unit-test, so the two never share the runner's memory: run together, the
# runner killed it (ITEM-0075).
integration-test:
  extends: [.go, .heavy]
  stage: test
  needs: [unit-test]
  services:
    - name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
        KUBERNETES_SERVICE_MEMORY_REQUEST: 1536Mi
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - make test-integration

build:
  extends: .go
  stage: build
  script:
    - make build

# The release check builds the release as a snapshot, publishing nothing,
# and tests it (ADR-0030). Its image goes into a Docker-in-Docker service,
# without the lab, so it needs a fraction of the integration job's memory.
release-check:
  extends: [.go, .heavy]
  stage: build
  services:
    - name: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - make release-check

docs-site:
  extends: .go
  stage: build
  script:
    - make docs-links

vuln:
  extends: .go
  stage: security
  script:
    - make vuln

secrets:
  extends: .go
  stage: security
  variables:
    GIT_DEPTH: "0" # gitleaks scans the whole history
  script:
    - make secrets

# Publishing (ADR-0030), the one tag-only job that `make project-lint` allows
# (ADR-0032): for a version tag, after every other stage of the tag's
# pipeline has passed. GitLab's variables are mapped to the names that
# `make release` takes, so the Makefile names no forge. The job token pushes
# the image to the project's registry, and makes the release. It builds the
# release again, from a cold cache, so it's one of the heavy jobs.
release:
  extends: [.go, .heavy]
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  variables:
    RELEASE_IMAGE: $CI_REGISTRY_IMAGE
    RELEASE_REGISTRY: $CI_REGISTRY
    RELEASE_REGISTRY_USER: $CI_REGISTRY_USER
    RELEASE_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GITLAB_API_URL: $CI_API_V4_URL
    GITLAB_URL: $CI_SERVER_URL
  script:
    - make release
