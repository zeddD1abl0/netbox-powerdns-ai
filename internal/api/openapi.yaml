# Generated by `make generate` from api/openapi.yaml. Edit that file, not this one.
# nbpdns's API (ADR-0012, ADR-0033): the source of truth for the API.
# `make generate` generates the server's code and the embedded copy of this
# file from it, and the reference page docs/reference/api.md. Every change
# must stay backward compatible: there's no version in the paths.
openapi: 3.1.0
info:
  title: nbpdns API
  version: 1.0.0
  description: >-
    The read-only API of nbpdns, which compares the DNS data in NetBox's DNS
    plugin with what each PowerDNS server group's primary serves. It serves
    the service's status, each server group's drift, its zones and their
    changes, and each zone's DNS records as NetBox defines them. Everything
    is last-known state, as of the last successful read of each side. The
    API has no authentication until M10, so serve it only on a trusted
    network.
  contact:
    name: nbpdns
    url: https://github.com/zeddD1abl0/netbox-powerdns-ai
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-api-id: f4c4a283-c96e-410e-a606-bdda49d9af95
  x-audience: company-internal
servers:
  - url: /api
    description: The API, at the service's address, `server.listen`.
# No authentication until M10 (ADR-0033): an empty requirement says so.
security:
  - {}
tags:
  - name: service
    description: The nbpdns service itself.
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get the service's status
      description: >-
        Returns the service's build, uptime, readiness and liveness, the
        refresh schedule and how the last refresh went, NetBox's state, and
        where spans are exported. Each server group's state is a resource
        of its own, under `/server-groups`.
      tags: [service]
      parameters:
        - $ref: "#/components/parameters/FlowID"
      responses:
        "200":
          description: The service's status.
          headers:
            X-Flow-ID:
              $ref: "#/components/headers/FlowID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                version: v0.2.0
                revision: ec048d836f57f7ee1102e27b7baa38d8a17469bc
                started: "2026-10-08T01:00:00Z"
                uptime_seconds: 754.2
                ready: true
                live: true
                schedule:
                  interval_seconds: 300
                  timeout_seconds: 600
                  last_refresh:
                    started: "2026-10-08T01:10:00Z"
                    finished: "2026-10-08T01:10:02Z"
                    duration_seconds: 2.1
                    outcome: complete
                    error: null
                  last_complete_refresh: "2026-10-08T01:10:02Z"
                  next_refresh: "2026-10-08T01:15:00Z"
                  refreshes:
                    complete: 3
                    incomplete: 0
                    failed: 0
                netbox:
                  url: https://netbox.example.com/
                  up: true
                  error: null
                tracing:
                  exported: false
                  endpoint: null
                  protocol: null
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    FlowID:
      name: X-Flow-ID
      in: header
      description: >-
        The request's flow ID, to follow it through the logs. A request
        without a valid one is given one. Either way, the response returns
        it, and it's the request's `request_id` in nbpdns's logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:+/=-]+$"
  headers:
    FlowID:
      description: The request's flow ID, as sent, or as nbpdns made it.
      schema:
        type: string
  responses:
    Problem:
      description: Any other error.
      headers:
        X-Flow-ID:
          $ref: "#/components/headers/FlowID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: null
            instance: /api/status
  schemas:
    Problem:
      type: object
      description: An error, as RFC 9457 describes it.
      required: [type, title, status, detail, instance]
      examples:
        - type: about:blank
          title: Not Found
          status: 404
          detail: No server group is named site-z.
          instance: /api/server-groups/site-z
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            The kind of problem. `about:blank` means the status code says it
            all.
          examples: [about:blank]
        title:
          type: string
          description: A short summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The response's HTTP status code.
          examples: [404]
        detail:
          type: [string, "null"]
          description: What went wrong with this request, or null.
          examples: [No server group is named site-z.]
        instance:
          type: [string, "null"]
          format: uri-reference
          description: The path of the request that had the problem, or null.
          examples: [/api/server-groups/site-z]
    Status:
      type: object
      description: The nbpdns service's state.
      required: [version, revision, started, uptime_seconds, ready, live, schedule, netbox, tracing]
      properties:
        version:
          type: string
          description: The build's version.
          examples: [v0.2.0]
        revision:
          type: string
          description: The build's Git commit.
          examples: [ec048d836f57f7ee1102e27b7baa38d8a17469bc]
        started:
          type: string
          format: date-time
          description: When the service started.
          examples: ["2026-10-08T01:00:00Z"]
        uptime_seconds:
          type: number
          format: double
          minimum: 0
          description: The time since the service started.
          examples: [754.2]
        ready:
          type: boolean
          description: >-
            Whether the first refresh has finished, whatever its outcome, as
            `/readyz` reports.
          examples: [true]
        live:
          type: boolean
          description: >-
            Whether a refresh has started within `drift.interval` +
            `drift.timeout` + 1 minute, as `/livez` reports.
          examples: [true]
        schedule:
          $ref: "#/components/schemas/Schedule"
        netbox:
          $ref: "#/components/schemas/NetBoxState"
        tracing:
          $ref: "#/components/schemas/Tracing"
    Schedule:
      type: object
      description: The refreshes' schedule, and how they went.
      required: [interval_seconds, timeout_seconds, last_refresh, last_complete_refresh, next_refresh, refreshes]
      properties:
        interval_seconds:
          type: number
          format: double
          minimum: 0
          description: The time from one refresh's start to the next's, `drift.interval`.
          examples: [300]
        timeout_seconds:
          type: number
          format: double
          minimum: 0
          description: How long a refresh may take, `drift.timeout`.
          examples: [600]
        last_refresh:
          description: The last refresh that finished, or null before the first.
          oneOf:
            - $ref: "#/components/schemas/Refresh"
            - type: "null"
        last_complete_refresh:
          type: [string, "null"]
          format: date-time
          description: When the last complete refresh finished, or null.
          examples: ["2026-10-08T01:10:02Z"]
        next_refresh:
          type: [string, "null"]
          format: date-time
          description: When the next refresh starts, or null while one runs.
          examples: ["2026-10-08T01:15:00Z"]
        refreshes:
          $ref: "#/components/schemas/RefreshCounts"
    Refresh:
      type: object
      description: A refresh that finished.
      required: [started, finished, duration_seconds, outcome, error]
      properties:
        started:
          type: string
          format: date-time
          description: When the refresh started.
          examples: ["2026-10-08T01:10:00Z"]
        finished:
          type: string
          format: date-time
          description: When the refresh finished.
          examples: ["2026-10-08T01:10:02Z"]
        duration_seconds:
          type: number
          format: double
          minimum: 0
          description: How long the refresh took.
          examples: [2.1]
        outcome:
          type: string
          enum: [complete, incomplete, failed]
          description: >-
            `complete` if NetBox and every group's primary were read,
            `incomplete` if a primary couldn't be, and `failed` if NetBox
            couldn't be, or the refresh ran out of time.
          examples: [complete]
        error:
          type: [string, "null"]
          description: >-
            Why a failed refresh failed: NetBox's error, or the timeout's.
            Null otherwise. A group's error is with the group.
          examples: [null]
    RefreshCounts:
      type: object
      description: The refreshes that finished since the service started, by outcome.
      required: [complete, incomplete, failed]
      properties:
        complete:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that read NetBox and every group's primary.
          examples: [3]
        incomplete:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that couldn't read a group's primary.
          examples: [0]
        failed:
          type: integer
          format: int64
          minimum: 0
          description: Refreshes that couldn't read NetBox, or ran out of time.
          examples: [0]
    NetBoxState:
      type: object
      description: NetBox's state, as of the last refresh.
      required: [url, up, error]
      properties:
        url:
          type: string
          format: uri
          description: NetBox's URL, `netbox.url`.
          examples: [https://netbox.example.com/]
        up:
          type: [boolean, "null"]
          description: Whether the last refresh could read NetBox, or null before the first.
          examples: [true]
        error:
          type: [string, "null"]
          description: Why NetBox couldn't be read, or null.
          examples: [null]
    Tracing:
      type: object
      description: Where the service's spans are exported.
      required: [exported, endpoint, protocol]
      properties:
        exported:
          type: boolean
          description: Whether spans are exported, which they are when `otlp.endpoint` is set.
          examples: [true]
        endpoint:
          type: [string, "null"]
          description: The OTLP collector's endpoint, `otlp.endpoint`, or null.
          examples: [https://otel.example.com:4318]
        protocol:
          description: The OTLP protocol, `otlp.protocol`, or null.
          oneOf:
            - $ref: "#/components/schemas/OTLPProtocol"
            - type: "null"
    OTLPProtocol:
      type: string
      description: An OTLP protocol.
      enum: [http/protobuf, grpc]
      examples: [http/protobuf]
