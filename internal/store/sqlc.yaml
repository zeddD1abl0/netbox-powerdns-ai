# sqlc generates the store's queries for SQLite, into ./sqlite, from the
# migrations' schema and the queries in this directory's .sql files
# (ADR-0038), with the Querier interface that the store calls on either
# database (ADR-0046). `make generate` runs it, and `make generate-check`
# runs `sqlc diff`. Never edit ./sqlite by hand.
version: "2"
sql:
  - engine: sqlite
    schema: migrations
    queries: .
    gen:
      go:
        package: sqlite
        out: sqlite
        emit_interface: true
