# Checks that PostgreSQL takes the same schema and queries as sqlc.yaml
# (ADR-0038): `make generate` and `make generate-check` run `sqlc compile`
# on it, which parses them as PostgreSQL would and writes nothing. M09
# generates its PostgreSQL package from it.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: .
    gen:
      go:
        package: postgres
        out: postgres
