# sqlc generates the store's queries for PostgreSQL, into ./postgres, from
# the same schema and queries as sqlc.yaml (ADR-0046). sqlc types LIMIT's
# parameters as integer, PostgreSQL's int4, which maps to int64, as on
# SQLite, so that each struct has the same fields as its SQLite twin, and the
# store's adapter converts one to the other. `make generate` runs it, and
# `make generate-check` runs `sqlc diff`. Never edit ./postgres by hand.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: .
    gen:
      go:
        package: postgres
        out: postgres
        overrides:
          - db_type: integer
            go_type: int64
