# Vale prose linter (make docs-lint). Rules: docs/contributing/documentation-style.md.
# The Google package is vendored in .vale/styles/Google (MIT license in
# .vale/Google.LICENSE); `make vale-sync` refreshes it. Builds never download
# styles.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google
Vocab = nbpdns

[*.md]
BasedOnStyles = Vale, Google, nbpdns
# Configuration keys, such as database.url, which the command-line reference
# shows as the commands' help writes them, without code formatting. They're
# names, not words.
TokenIgnores = \b(?:audit|database|drift|log|netbox|otlp|powerdns|server)\.[a-z_]+\b

# Accepted ADRs are never edited (ADR-0001), so they can't be changed to
# satisfy style rules. Check them for spelling and banned words only.
[docs/adr/*.md]
BasedOnStyles = Vale, nbpdns
# Repository and tool names in accepted ADRs keep their original case.
Vale.Terms = NO
