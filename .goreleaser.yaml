# GoReleaser builds nbpdns's releases (ADR-0030). `make release-check` runs
# it as a snapshot, in every pipeline, and `make release` for a version tag.
# Every file's time is the commit's, and its owner root, so that one commit
# builds the same bytes on any machine. The version nbpdns reports comes from Go's build info, so no -X
# flags are set: a build at tag v0.1.0 reports v0.1.0.
version: 2

project_name: nbpdns

builds:
  - id: nbpdns
    main: ./cmd/nbpdns
    binary: nbpdns
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nbpdns
    ids: [nbpdns]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: &binary
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &file
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *file
      - src: CHANGELOG.md
        info: *file

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

# The image (ADR-0030, ADR-0031): one multi-arch index, built by ko on
# Debian's distroless static base, pinned by its index's digest, as user
# 65532, with an SPDX SBOM. In snapshot mode, ko loads it into the Docker
# daemon at DOCKER_HOST, as goreleaser.ko.local; otherwise it pushes it to
# RELEASE_IMAGE. The source label is the module's path, not the clone URL,
# which in CI carries a token.
kos:
  - id: nbpdns
    build: nbpdns
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3
    repositories:
      - '{{ envOrDefault "RELEASE_IMAGE" "nbpdns" }}'
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    bare: true
    user: "65532:65532"
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.title: nbpdns
      org.opencontainers.image.description: Keeps PowerDNS Authoritative in step with NetBox's DNS plugin.
      org.opencontainers.image.source: https://github.com/zeddD1abl0/netbox-powerdns-ai
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
