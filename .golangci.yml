# golangci-lint v2 configuration for every Go module in the repository.
# Run it with `make lint`. Each exclusion below says why it exists.
version: "2"

run:
  timeout: 5m
  # Lint the integration and release tests too, which carry these build tags.
  build-tags: [integration, release]

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose # unclosed HTTP response bodies leak connections
    - contextcheck # functions that should pass a context along
    - copyloopvar # redundant loop-variable copies (Go 1.22+ semantics)
    - errname # sentinel errors named errFoo / ErrFoo, error types named FooError
    - errorlint # compare and wrap errors with errors.Is/As and %w
    - exhaustive # switches over enums cover every value
    - gocritic # a broad set of correctness and style checks
    - gosec # security problems
    - misspell # common misspellings in comments and strings
    - noctx # HTTP requests built without a context
    - nolintlint # //nolint directives must be specific and explained
    - revive # the successor to golint
    - sloglint # log/slog calls pass a context, so every line carries the trace and request IDs
    - rowserrcheck # sql.Rows.Err is checked
    - sqlclosecheck # sql.Rows and sql.Stmt are closed
    - unconvert # unnecessary type conversions
    - unparam # unused function parameters and results
    - usestdlibvars # use net/http constants instead of literals
  settings:
    sloglint:
      context: all # every call passes a context (CLAUDE.md: IDs on every line)
      no-global: all # no package-level slog.Info: loggers are configured per run
      static-msg: true
      msg-style: lowercased
      key-naming-case: snake
      # Keys that slog or the logging handler sets on every line.
      forbidden-keys: [time, level, msg, source, trace_id, span_id, request_id]
    misspell:
      locale: US # the Google developer documentation style guide uses US spelling
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    presets:
      - comments # revive's exported-comment rules; doc comments are reviewed, not linted
      - std-error-handling # unchecked fmt.Fprint*, Close and os.Remove where failure can't be acted on
      - common-false-positives
    rules:
      # projctl is a dev tool that reads and writes files in its own repository:
      # paths come from the repo, written files are normal 0644 repo files, and
      # there is no untrusted party to race a symlink against.
      - path: tools/projctl/
        linters: [gosec]
        text: "G122|G301|G302|G304|G306"
      # Tests use fake credentials, to prove they're rejected or redacted.
      - path: _test\.go
        linters: [gosec]
        text: "G101"
      # hooktest runs the repository's own hooks, and the pinned tools the
      # Makefile names in its environment, on scratch files.
      - path: tools/hooktest/
        linters: [gosec]
        text: "G204|G703"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zeddD1abl0/netbox-powerdns-ai
